<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122c28"><title>Atelier capacités · PMD</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./src/ui/styles/lab.css"><link rel="stylesheet" href="./src/ui/styles/editor.css"></head>
<body class="lab-body">
  <header class="lab-header"><a href="./">← Retour au jeu</a><div><span class="lab-kicker">PMD · OUTILS DE CRÉATION</span><h1>Atelier capacités</h1></div><small id="lab-build"></small><span id="lab-offline">Connexion…</span><button id="lab-install" hidden>Installer</button></header>
  <main class="lab-workspace">
    <nav class="lab-library" aria-label="Capacités"><label>Bibliothèque<input id="lab-search" type="search" placeholder="Rechercher une capacité"></label><div id="lab-moves"></div></nav>
    <section class="lab-stage"><div class="lab-stage-heading"><h2 id="lab-title">Préparation de l’atelier…</h2><span id="lab-kind"></span><output id="lab-health"></output></div><div class="lab-canvas-wrap"><canvas id="lab-canvas" aria-label="Aperçu réel de la capacité"></canvas></div>
      <div class="lab-transport"><button id="lab-play">▶ Rejouer</button><button id="lab-pause">Pause</button><button id="lab-step">+ 1 image</button><label>Vitesse<select id="lab-rate"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option></select></label><output id="lab-time">0,00 s</output><output id="lab-phase">Repos</output></div>
      <label class="lab-timeline">Chronologie<input id="lab-seek" type="range" min="0" max="8" step="0.0166667" value="0"></label><div id="lab-phases" class="lab-phases"></div><p id="lab-status" role="status">Chargement des sprites locaux…</p>
    </section>
    <aside class="lab-inspector" aria-label="Réglages"><h2>Simulation</h2><label>Lanceur<select id="lab-caster"></select></label><label>Cible<select id="lab-target-species"></select></label><label class="lab-check"><input id="lab-target-moving" type="checkbox"> Cible mobile</label><label>Graine aléatoire<input id="lab-seed" type="number" min="1" max="4294967295" step="1" value="1"></label><label>Distance de la cible (cases)<input id="lab-distance" type="number" min="0.5" max="5" step="0.25" value="1"></label><label>Orientation<select id="lab-facing"></select></label><label class="lab-check"><input id="lab-overlays" type="checkbox" checked> Zones et contacts</label><div id="attack-editor"></div><details><summary>Définition courante</summary><pre id="lab-definition"></pre></details></aside>
  </main><script type="module" src="./src/app/attack-lab.ts"></script>
</body></html>
